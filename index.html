<!doctype html>
<html lang="en" data-theme="light" data-mode="patient">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BayouCare — Cancer Care Navigation for Louisiana</title>
    <link rel="icon" type="image/png" href="/bayoucare-logo.png" />
    <meta
      name="description"
      content="BayouCare helps Louisiana patients and care teams navigate cancer care — appointments, screenings, transportation, and survivorship planning."
    />

    <!--
      Theme boot. This MUST stay inline and pre-paint: it reads the saved theme
      and writes it onto <html> before the first frame, so a dark-mode user never
      sees a white flash. Moving this into a React effect reintroduces the FOUC.
      The `bc-theme` key is the same one the legacy app used, so existing users
      keep their preference.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('bc-theme')
          if (!saved) {
            saved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = saved
          document.documentElement.classList.toggle('dark', saved === 'dark')
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
          document.documentElement.classList.remove('dark')
        }
      })()
    </script>

    <!--
      The boot shell's styles, inline and self-contained ON PURPOSE.

      This markup paints with the document — before the ~240 KB JS bundle has
      downloaded, parsed and executed. Measured on production, that gap was
      3.6s of white page, which a client-rendered SPA cannot paint its way out
      of from inside React: `PendingShell` only exists once React runs.

      So it cannot depend on the stylesheet either, which is why the colours
      below are the real design tokens WITH literal fallbacks rather than
      classes. The dark override is repeated here for the same reason — a
      dark-mode user should not get a cream flash while the CSS is in flight.

      Keep this visually identical to `src/components/layout/PendingShell.tsx`:
      React replaces this markup on mount, and any difference shows as a blink
      at the handover.
    -->
    <style>
      .boot-shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        min-height: 100dvh;
        background: var(--background, #f7f7f5);
        color: var(--brand-700, #0f6b4c);
        font-family: 'Sora Variable', Sora, system-ui, sans-serif;
      }
      [data-theme='dark'] .boot-shell {
        background: var(--background, #121212);
        color: var(--brand-600, #3ecf8e);
      }
      .boot-shell .boot-mark {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .boot-shell .boot-logo {
        height: 112px;
        width: auto;
        object-fit: contain;
      }
      .boot-shell .boot-track {
        width: 160px;
        height: 4px;
        border-radius: 999px;
        overflow: hidden;
        background: var(--soft, #f4f7f4);
      }
      .boot-shell .boot-bar {
        width: 33%;
        height: 100%;
        border-radius: 999px;
        background: currentColor;
        animation: boot-sweep 1.2s ease-in-out infinite;
      }
      @keyframes boot-sweep {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-shell .boot-bar {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!--
      React replaces this on mount (`createRoot().render()` clears the
      container). It carries no record data — a wordmark and a bar — for the
      same reason `PendingShell` does not: this is what anyone sees when they
      open the URL, including whoever is standing behind them.
    -->
    <div id="root">
      <div class="boot-shell" role="status" aria-live="polite">
        <div class="boot-mark">
          <img
            class="boot-logo"
            src="/bayoucare-logo.png"
            alt="BayouCare — Supporting Louisiana through every step"
          />
        </div>
        <div class="boot-track"><div class="boot-bar"></div></div>
        <span class="sr-only-text">Loading</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
